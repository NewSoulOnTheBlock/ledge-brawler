# The arena server on Fly.io (README.md), deployed from the repository root:
#   fly deploy --config apps/app/arena/fly.toml --ha=false
# One Machine, always on: every table lives in its memory, so a second Machine would split the players and a stopped
# one would drop them. Fly's proxy ends TLS and passes WebSockets through, so the game connects to wss://<app>.fly.dev/play.
app = "five-blades-arena"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = 10

[build]
  dockerfile = "Dockerfile"

[env]
  SITE = "https://ledge-brawler.vercel.app"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 5000
    hard_limit = 10000

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "3s"
    grace_period = "20s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"

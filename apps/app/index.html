<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Five Blades</title>
    <!-- What a link to the game shows where it is shared, and what a phone puts on its home screen (public/). -->
    <meta name="description" content="A pixel-art brawler: five blades, five stories, one stolen god. Fight through the campaign, outlast the waves, or duel up to five players online. Plays in the browser with keyboard, controller or touch." />
    <meta name="theme-color" content="#07090d" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Five Blades" />
    <meta property="og:title" content="Five Blades" />
    <meta property="og:description" content="A pixel-art brawler: five blades, five stories, one stolen god. Campaign, Survival, and online duels for up to five." />
    <meta property="og:url" content="https://ledge-brawler.vercel.app/" />
    <meta property="og:image" content="https://ledge-brawler.vercel.app/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Five hooded fighters, each with a blade, stand before an empty throne." />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- The first paint needs these two before anything else: the picture behind the home screen, and the face everything is set in (public/fonts/README.md). -->
    <link rel="preload" as="image" href="/src/home.webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/src/logo.webp" fetchpriority="high" />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/seven-swordsmen.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/evil-empire.woff2" crossorigin />
    <style>
      /* One weight, given for every weight, so that bold text uses the face as it is drawn and is not thickened by the browser. */
      @font-face { font-family: "Seven Swordsmen BB"; font-weight: 100 900; font-display: block; src: url(/fonts/seven-swordsmen.woff2) format("woff2"); }
      @font-face { font-family: "Evil Empire"; font-weight: 100 900; font-display: block; src: url(/fonts/evil-empire.woff2) format("woff2"); }
      @keyframes loading { from { transform: translateX(-60%); } to { transform: translateX(260%); } }
    </style>
  </head>
  <body class="touch-none overflow-hidden overscroll-none bg-background font-mono text-foreground select-none">
    <!-- What is on the page while the game is being fetched: the home screen as it will be (TitleBackdrop, screens.tsx), with a bar where its
         ways in will come. Under the picture is a few bytes of the same picture, there at once and blurred, until the picture itself has come.
         The game takes its place without the picture or the name moving. -->
    <div id="root">
      <div role="status" aria-label="Loading Five Blades" style="position:fixed;inset:0;overflow:hidden;background:url(/src/home.webp) center/cover,#000 url(/src/home-tiny.webp) center/cover">
        <img src="/src/logo.webp" alt="Five Blades" width="866" height="288" style="position:absolute;top:max(3vh,40px);left:0;right:0;margin:0 auto;width:min(866px,66vw,calc(32dvh*866/288));height:auto;filter:drop-shadow(0 6px 18px rgba(0,0,0,0.85))" />
        <span style="position:absolute;left:0;right:0;bottom:0;display:grid;place-items:center;height:calc(148px + 7vh);padding-top:60px;box-sizing:border-box;background:linear-gradient(to top,rgba(0,0,0,0.85),transparent)">
          <span style="display:block;width:180px;height:3px;background:rgba(246,223,166,0.25);overflow:hidden"><i style="display:block;width:38%;height:100%;background:#d63c28;animation:loading 1.1s ease-in-out infinite alternate"></i></span>
        </span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Installable and playable offline: the worker is written by the build (vite.config.ts) and is not there while developing. -->
    <script>if ("serviceWorker" in navigator && !/^(localhost|127.)/.test(location.hostname)) addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => undefined));</script>
  </body>
</html>
